<!DOCTYPE html>
<html>
<head>
  <title>DOI to BibTeX</title>
  <style>
    body {
      width: 400px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      padding: 8px 16px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #3367d6;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    textarea {
      width: 100%;
      height: 200px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      resize: vertical;
      box-sizing: border-box;
    }
    .status {
      color: #666;
      font-size: 14px;
      margin-top: 8px;
    }
    .error {
      color: #d32f2f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>DOI to BibTeX Converter</h2>
    <input type="text" id="doiInput" placeholder="Enter DOI, PMID, PMCID, or doi.org URL">
    <button id="convertButton">Convert to BibTeX</button>
    <textarea id="bibtexOutput" placeholder="BibTeX will appear here..." readonly></textarea>
    <button id="copyButton">Copy to Clipboard</button>
    <div id="status" class="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
